name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pylint-badge
    - name: Analysing the code with pylint
      run: |
        pylint --exit-zero --output-format=text $(git ls-files '*.py') > pylint.log
    - name: Generate Pylint badge
      run: |
        pylint-badge -f svg -o pylint-badge.svg pylint.log
    - name: Commit Pylint badge
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "docs: update pylint badge"
        file_pattern: pylint-badge.svg
