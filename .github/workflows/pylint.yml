name: Pylint

on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: pyproject.toml
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Install project
        run: uv pip install -e .
      - name: Analysing the code with pylint
        run: uv run pylint --output-format=json:pylint.json $(git ls-files '*.py') || exit 0
      - name: Generate Linter Badge
        if: always()
        run: uv run genbadge pylint -i pylint.json -o pylint.svg
      - name: Commit Linter badge
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update pylint badge"
          file_pattern: "pylint.svg"
