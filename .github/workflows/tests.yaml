name: Tests & Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Grant permission for the action to commit the coverage badge back to the repo
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12" # You can adjust this based on your .python-version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install testing and coverage tools
        pip install pytest pytest-cov coverage-badge

        # Install your project's dependencies (assumes pyproject.toml is present)
        pip install -e .

    - name: Run unit tests and coverage
      run: |
        # Replace 'logfetcher' with the specific directory you want to measure coverage for
        pytest --cov=logfetcher --cov-report=term

    - name: Generate Coverage Badge
      # Only generate and commit the badge when pushing to main, not on PRs
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        coverage-badge -o coverage.svg -f

    - name: Commit Coverage Badge
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: update coverage badge"
        file_pattern: coverage.svg
