name: Tests & Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Grant permission for the action to commit the coverage badge back to the repo
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # If one Python version fails, continue running the others to see full results
      fail-fast: false
      matrix:
        # Define the Python versions you want to test against
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install uv and set Python version
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        # Uses python-version from the "strategy"
        python-version: ${{ matrix.python-version }}
        cache-dependency-glob: pyproject.toml

    - name: Install dependencies
      # Syncs pyproject.toml / uv.lock to an isolated virtual environment
      run: uv sync --all-extras --dev

    - name: Install project
      run: uv pip install -e .

    - name: Run unit tests and coverage
      # uv run automatically uses the virtual environment created by uv sync
      run: uv run pytest --cov=logfetcher --cov-report=term --cov-report=xml --junitxml=pytest.xml

    - name: Generate badges
      # Only generate and commit the badge when pushing 3.12 to main to prevent merge conflicts
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.python-version == '3.12'
      run: |
        uv run genbadge coverage -i coverage.xml -o coverage.svg
        uv run genbadge tests -i pytest.xml -o tests.svg

    - name: Commit badges
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.python-version == '3.12'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: update badges"
        file_pattern: "*.svg"
