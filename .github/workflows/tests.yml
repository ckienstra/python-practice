name: Tests & Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Grant permission for the action to commit the coverage badge back to the repo
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install uv and set Python version
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: "3.12" # Matches your .python-version
        cache-dependency-glob: pyproject.toml

    - name: Install dependencies
      # Syncs your pyproject.toml / uv.lock to an isolated virtual environment
      run: uv sync --all-extras --dev

    - name: Install project
      run: uv install -e .

    - name: Run unit tests and coverage
      # uv run automatically uses the virtual environment created by uv sync
      # Note: replace 'logfetcher' if you want to measure a different directory
      run: uv run pytest --cov=logfetcher --cov-report=term --cov-report=xml --junitxml=pytest.xml

    - name: Generate badges
      # Only generate and commit the badge when pushing to main, not on PRs
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        uv run genbadge coverage -i coverage.xml -o coverage.svg
        uv run genbadge tests -i pytest.xml -o tests.svg

    - name: Commit badges
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: update badges"
        file_pattern: "*.svg"
